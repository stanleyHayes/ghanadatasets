openapi: 3.1.0
info: { title: GhanaDataset Registry API, version: 2026.09.01-beta.1 }
servers: [{ url: https://api-datasets.digitalghana.dev }]
paths:
  /health:
    get: { operationId: health, responses: { "200": { description: Healthy } } }
  /v1/datasets:
    get:
      operationId: searchDatasets
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: publisher, in: query, schema: { type: string } }
        - { name: topic, in: query, schema: { type: string } }
        - { name: format, in: query, schema: { type: string } }
      responses: { "200": { description: Versioned metadata search } }
  /v1/datasets/{id}:
    get:
      operationId: getDataset
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: Metadata record }, "404": { description: Unknown ID } }
